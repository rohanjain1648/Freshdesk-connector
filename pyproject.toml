[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freshdesk-connector"
version = "0.1.0"
description = "Read-only Freshdesk MCP connector for Razorpay Agent Studio agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "starlette>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
freshdesk-connector = "freshdesk_connector.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/freshdesk_connector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
